name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Download YOLOv8n ONNX model
        run: bash scripts/download-model.sh
      - name: Inspect model graph
        run: |
          pip install -q onnx
          python3 -c "
          import onnx
          m = onnx.load('app/src/main/assets/models/yolov8n.onnx')
          [print('IN:', i.name, [d.dim_value for d in i.type.tensor_type.shape.dim]) for i in m.graph.input]
          [print('OUT:', o.name, o.type.tensor_type.elem_type, [d.dim_value for d in o.type.tensor_type.shape.dim]) for o in m.graph.output]
          "
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yolo-camera-debug
          path: app/build/outputs/apk/debug/*.apk
