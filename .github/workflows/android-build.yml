name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-export.txt
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Export YOLOv8n ONNX dari .pt resmi
        run: |
          pip install -q -r requirements-export.txt
          curl -sL -o yolov8n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt
          yolo export model=yolov8n.pt format=onnx imgsz=640
          mkdir -p app/src/main/assets/models
          mv yolov8n.onnx app/src/main/assets/models/yolov8n.onnx
          ls -lh app/src/main/assets/models/
      - name: Inspect model graph
        run: |
          python3 -c "
          import onnx
          m = onnx.load('app/src/main/assets/models/yolov8n.onnx')
          [print('IN:', i.name, [d.dim_value for d in i.type.tensor_type.shape.dim]) for i in m.graph.input]
          [print('OUT:', o.name, o.type.tensor_type.elem_type, [d.dim_value for d in o.type.tensor_type.shape.dim]) for o in m.graph.output]
          "
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yolo-camera-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Siapkan file release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk yolo-camera-debug.apk
      - name: Tulis link APK ke summary (klik langsung, bukan zip)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## Download APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${GITHUB_SHA::7}\` — branch \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[klik di sini untuk download APK (yolo-camera-debug.apk)](https://github.com/${{ github.repository }}/releases/download/apk-build/yolo-camera-debug.apk)" >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY
      - name: Publish APK sebagai Release asset (direct download, bukan zip)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build
          name: YOLO Camera APK
          prerelease: true
          body: |
            Build otomatis dari `${{ github.sha }}`.

            - APK: `yolo-camera-debug.apk`
            - Model: `yolov8n.onnx` (export standar dari `.pt` resmi Ultralytics)
            - Download (klik langsung, bukan zip):
              - https://github.com/${{ github.repository }}/releases/download/apk-build/yolo-camera-debug.apk
          files: |
            yolo-camera-debug.apk
            app/src/main/assets/models/yolov8n.onnx
